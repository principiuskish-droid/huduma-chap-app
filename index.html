<!DOCTYPE html>
<html lang="sw"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a6dff">
<title>Huduma Chap</title>
<style>
:root{--b:#1a6dff;--b2:#e8f0ff;--ink:#14213d;--mute:#64708a;--bg:#f3f6fd;--line:#e3e8f3;--ok:#1f8a5b;--or:#e0701f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(#dce8ff,#f6f8fd 300px) var(--bg);color:var(--ink)}
#app{max-width:480px;margin:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 100px}
h1{font-size:30px;line-height:1.15;margin:14px 0 8px}h2{margin:0;font-size:22px}h3{margin:18px 0 10px;font-size:17px;display:flex;justify-content:space-between}
small,.mute{color:var(--mute)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.pri{background:var(--b);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700}
.ghost{background:var(--b2);color:var(--b);border-radius:12px;padding:12px 14px;font-weight:700}
.wide{width:100%;margin-top:8px}.big{padding:16px;font-size:17px;border-radius:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lang{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:700;color:var(--b)}
.av{position:relative;border-radius:50%;flex:none}
.av svg{width:100%;height:100%;border-radius:50%;display:block}
.av i{position:absolute;right:-5px;bottom:-5px;background:#fff;border-radius:50%;width:40%;height:40%;display:grid;place-items:center;font-style:normal;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.search{position:relative;margin-top:14px}.search input{padding-right:44px;border-radius:14px;box-shadow:0 2px 8px rgba(26,109,255,.1);border:0}
.search span{position:absolute;right:15px;top:15px}
.banner{margin-top:14px;border-radius:20px;padding:16px;background:linear-gradient(120deg,#1a6dff,#6aa2ff);color:#fff;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
.banner b{display:block;font-size:17px}.banner p{margin:6px 0 10px;font-size:13px;opacity:.9}
.banner .pill{background:#fff;color:var(--b);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:#fff;border-radius:16px;padding:12px 2px;text-align:center;font-size:12px;color:var(--ink);box-shadow:0 2px 8px rgba(20,33,61,.05);border:2px solid transparent}
.cat i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}.cat.on{border-color:var(--b);background:var(--b2)}
.fc,.jc{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,33,61,.06)}
.fc{display:grid;grid-template-columns:58px 1fr 30px;gap:12px;align-items:start}
.acts{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;background:#fff1e6;color:var(--or);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.ok{color:var(--ok);font-weight:700;font-size:12px}.hrt{background:none;font-size:20px;padding:0}
a.btn{display:inline-block;background:var(--ok);color:#fff;padding:10px 14px;border-radius:12px;margin:8px 8px 0 0;text-decoration:none;font-weight:700}
.st{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--b2);color:var(--b)}
.s-in_progress{background:#fff1e6;color:var(--or)}.s-completed{background:#e3f6ec;color:var(--ok)}.s-disputed{background:#fde8e8;color:#c0392b}.s-awaiting_confirm{background:#f1e8ff;color:#7a3fd1}
.box{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(20,33,61,.06);margin-top:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:120px;background:none;padding:9px 2px;font-size:11px;color:var(--mute)}
nav button span{display:block;font-size:21px}nav button.on{color:var(--b);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(10,20,50,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));text-align:center}
.sheet .top{margin:0 -16px 12px;padding:26px 16px 16px;background:linear-gradient(#cfe0ff,#fff)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--b2);border-radius:14px;padding:10px 4px;font-weight:700}.stats small{display:block;font-weight:400}
.wel{text-align:center}.hero{position:relative;margin:10px auto 18px;width:240px;height:240px;border-radius:50%;background:radial-gradient(#cfe0ff,#e9f1ff)}
.hero .av{position:absolute;inset:20px;width:200px;height:200px}
.chip{position:absolute;background:#fff;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;box-shadow:0 3px 10px rgba(20,33,61,.15)}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://yqclcleayapbehuabvgu.supabase.co','sb_publishable_mvayIxILrgMU7SYTrJIfxQ_yPK_Xh2B');
const T={sw:{wt:'Fundi Bora Kwa Kazi Yako',ws:'Pata fundi waliohakikiwa karibu nawe, wasiliana moja kwa moja.',start:'Anza',c1:'✔ Waliohakikiwa',c2:'⭐ Alama za wateja',c3:'📞 Piga moja kwa moja',hi:'Habari 👋',search:'Tafuta fundi au eneo...',ban:'Fundi waliohakikiwa karibu nawe',ban2:'Kazi nzuri, bei ya makubaliano',svc:'Huduma',near:'Fundi maarufu karibu nawe',saved:'Waliohifadhiwa',prof:'Wasifu',contact:'Wasiliana',close:'Funga',home:'Mwanzo',jobs:'Kazi',me:'Mimi',out:'Toka',email:'Barua pepe',pw:'Nenosiri (herufi 6+)',name:'Jina kamili',phone:'Simu (2547XXXXXXXX)',cust:'Mteja',fundi:'Fundi',signup:'Jisajili',login:'Ingia',have:'Tayari una akaunti? Ingia',new:'Huna akaunti? Jisajili',none:'Hakuna bado',call:'Piga simu',wa:'WhatsApp',acc:'Kubali kazi',price:'Bei ya mwisho (KES)',done:'Kamilisha kazi',conf:'Thibitisha bei',comm:'Commission',area:'Eneo unalofanyia kazi',bio:'Kuhusu wewe na uzoefu wako',save:'Hifadhi',wait:'Wasifu wako unasubiri kuhakikiwa.',avail:'Ninapatikana kwa kazi',on:'Ndiyo',off:'Hapana',jn:'kazi',about:'Kuhusu',rate:'Alama',vf:'Amehakikiwa',st:{contacted:'Amewasiliana',in_progress:'Inaendelea',awaiting_confirm:'Inasubiri uthibitisho',completed:'Imekamilika',disputed:'Mgogoro'}},
en:{wt:'Best Fundis For Your Job',ws:'Find verified fundis near you and contact them directly.',start:'Get Started',c1:'✔ Verified',c2:'⭐ Customer ratings',c3:'📞 Call directly',hi:'Hello 👋',search:'Search fundi or area...',ban:'Verified fundis near you',ban2:'Quality work, agreed price',svc:'Services',near:'Popular fundis near you',saved:'Saved',prof:'Profile',contact:'Contact',close:'Close',home:'Home',jobs:'Jobs',me:'Me',out:'Log out',email:'Email',pw:'Password (6+ characters)',name:'Full name',phone:'Phone (2547XXXXXXXX)',cust:'Customer',fundi:'Fundi',signup:'Sign up',login:'Log in',have:'Have an account? Log in',new:'No account? Sign up',none:'Nothing yet',call:'Call',wa:'WhatsApp',acc:'Accept job',price:'Final price (KES)',done:'Mark complete',conf:'Confirm price',comm:'Commission',area:'Area you work in',bio:'About you and your experience',save:'Save',wait:'Your profile is waiting for verification.',avail:'Available for work',on:'Yes',off:'No',jn:'jobs',about:'About',rate:'Rating',vf:'Verified',st:{contacted:'Contacted',in_progress:'In progress',awaiting_confirm:'Awaiting confirmation',completed:'Completed',disputed:'Disputed'}}};
const CATS=[[1,'🚰','Bomba','Plumbing'],[2,'⚡','Umeme','Electrical'],[3,'🎨','Rangi','Painting'],[4,'🧹','Usafi','Cleaning'],[5,'🪚','Seremala','Carpentry'],[6,'🧱','Mjenzi','Masonry'],[7,'🔥','Uchomeleaji','Welding'],[8,'🏠','Paa','Roofing']];
let L='sw',me=null,fp=null,mode='login',S={tab:'home',q:'',cat:0,f:[],welcome:true};
const $=id=>document.getElementById(id),app=$('app'),t=k=>T[L][k];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=p=>{p=(p||'').replace(/\D/g,'');return p.startsWith('0')?'254'+p.slice(1):p};
const msg=m=>alert(m);
const hue=n=>{let h=0;for(const c of n||'x')h=(h*31+c.charCodeAt(0))%360;return h};
const icon=id=>(CATS.find(c=>c[0]===id)||[0,'🛠️'])[1];
const saved=()=>{try{return JSON.parse(localStorage.getItem('hc_saved')||'[]')}catch(e){return[]}};
function toggleSave(id){let s=saved();s=s.includes(id)?s.filter(x=>x!==id):[...s,id];try{localStorage.setItem('hc_saved',JSON.stringify(s))}catch(e){}if($('list'))list()}
function setLang(){L=L==='sw'?'en':'sw';boot()}
function avatar(f,s){
  const n=f.display_name||f.full_name||'x',h=hue(n),sk=['#f1c7a0','#d9a273','#a8744a','#7a4a2b'][h%4],hat=['#f2b705','#1a6dff','#e0701f','#1f8a5b'][(f.trade_id||h)%4];
  return `<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.2)}px"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="hsl(${h},75%,91%)"/><path d="M8 64Q8 43 32 43Q56 43 56 64Z" fill="#1a6dff"/><rect x="26" y="38" width="12" height="8" fill="${sk}"/><circle cx="32" cy="29" r="11" fill="${sk}"/><path d="M20 27Q20 14 32 14Q44 14 44 27Z" fill="${hat}"/><rect x="17" y="26" width="30" height="3.5" rx="1.7" fill="${hat}"/><circle cx="28" cy="32" r="1.4" fill="#14213d"/><circle cx="36" cy="32" r="1.4" fill="#14213d"/><path d="M28 36Q32 39 36 36" stroke="#14213d" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>${f.trade_id?`<i>${icon(f.trade_id)}</i>`:''}</div>`;
}
const langBtn=()=>`<button class="lang" onclick="setLang()">${L==='sw'?'EN':'SW'}</button>`;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return S.welcome?viewWelcome():viewAuth();
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p)return viewAuth();
  me=p;
  if(p.role==='fundi'){
    const {data:f}=await sb.from('fundi_profiles').select('*').eq('user_id',p.id).maybeSingle();
    fp=f;
    if(!f)return viewFundiSetup();
    if(S.tab==='home'||S.tab==='saved')S.tab='jobs';
  }
  go(S.tab);
}
function go(k){S.tab=k;k==='home'?viewHome():k==='saved'?viewSaved():k==='jobs'?viewJobs():viewMe()}
function nav(){
  const it=me.role==='fundi'?[['jobs','📋',t('jobs')],['me','👤',t('me')]]:[['home','🏠',t('home')],['saved','❤️',t('saved')],['jobs','📋',t('jobs')],['me','👤',t('me')]];
  return '<nav>'+it.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('')+'</nav>';
}
function viewWelcome(){
  app.innerHTML=`<div class="wel"><div class="row"><b style="font-size:18px">Huduma Chap</b>${langBtn()}</div>
  <h1>${t('wt')}</h1><p class="mute">${t('ws')}</p>
  <div class="hero">${avatar({display_name:'Hero',trade_id:1},200)}<span class="chip" style="left:-14px;top:30px">${t('c1')}</span><span class="chip" style="right:-14px;top:110px">${t('c2')}</span><span class="chip" style="left:0;bottom:14px">${t('c3')}</span></div>
  <button class="pri wide big" onclick="S.welcome=false;viewAuth()">${t('start')}</button></div>`;
}
function viewAuth(){
  const s=mode==='signup';
  app.innerHTML=`<div class="row"><h2>Huduma Chap</h2>${langBtn()}</div>
  <div class="box"><h3 style="margin-top:0">${s?t('signup'):t('login')}</h3>
  <input id="em" type="email" placeholder="${t('email')}"><input id="pw" type="password" placeholder="${t('pw')}">
  ${s?`<input id="nm" placeholder="${t('name')}"><input id="ph" type="tel" placeholder="${t('phone')}"><select id="rl"><option value="customer">${t('cust')}</option><option value="fundi">${t('fundi')}</option></select>`:''}
  <button class="pri wide" onclick="auth()">${s?t('signup'):t('login')}</button>
  <button class="ghost wide" onclick="mode=mode==='signup'?'login':'signup';viewAuth()">${s?t('have'):t('new')}</button></div>`;
}
async function auth(){
  const email=$('em').value.trim(),password=$('pw').value;
  if(mode==='signup'){
    const {data,error}=await sb.auth.signUp({email,password});
    if(error)return msg(error.message);
    if(!data.session)return msg('Turn off Confirm email in Supabase first.');
    const {error:e2}=await sb.from('profiles').insert({id:data.user.id,role:$('rl').value,full_name:$('nm').value,phone:num($('ph').value),language:L});
    if(e2)return msg(e2.message);
  }else{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)return msg(error.message);
  }
  boot();
}
async function viewFundiSetup(){
  const {data}=await sb.from('trades').select('*').order('id');
  app.innerHTML=`<h2>${t('prof')}</h2><div class="box"><input id="dn" placeholder="${t('name')}" value="${esc(me.full_name)}">
  <select id="tr">${data.map(x=>`<option value="${x.id}">${icon(x.id)} ${esc(x['name_'+L])}</option>`).join('')}</select>
  <input id="ar" placeholder="${t('area')}"><textarea id="bi" rows="3" placeholder="${t('bio')}"></textarea>
  <button class="pri wide" onclick="saveF()">${t('save')}</button></div>`;
}
async function saveF(){
  const {error}=await sb.from('fundi_profiles').insert({user_id:me.id,display_name:$('dn').value,trade_id:+$('tr').value,area:$('ar').value,bio:$('bi').value});
  if(error)return msg(error.message);
  boot();
}
async function fetchF(){
  const {data,error}=await sb.from('fundi_profiles').select('user_id,display_name,area,bio,rating_avg,jobs_done,trade_id,trades(name_en,name_sw)').eq('verified',true).eq('available',true);
  if(error)return msg(error.message);
  S.f=data;
}
async function viewHome(){await fetchF();drawHome()}
function drawHome(){
  app.innerHTML=`<div class="row"><div class="row" style="justify-content:flex-start">${avatar({full_name:me.full_name},46)}<div><small>${t('hi')}</small><h2 style="font-size:19px">${esc(me.full_name)}</h2></div></div>${langBtn()}</div>
  <div class="search"><input id="q" value="${esc(S.q)}" placeholder="${t('search')}" oninput="S.q=this.value;list()"><span>🔍</span></div>
  <div class="banner"><div><b>${t('ban')}</b><p>${t('ban2')}</p><button class="pill" onclick="S.cat=0;S.q='';drawHome()">${t('contact')} →</button></div>${avatar({display_name:'Banner',trade_id:2},96)}</div>
  <h3>${t('svc')}</h3><div class="cats">${CATS.map(c=>`<button class="cat ${S.cat===c[0]?'on':''}" onclick="S.cat=S.cat===${c[0]}?0:${c[0]};drawHome()"><i>${c[1]}</i>${L==='sw'?c[2]:c[3]}</button>`).join('')}</div>
  <h3>${t('near')}</h3><div id="list"></div>`+nav();
  list();
}
async function viewSaved(){
  await fetchF();
  app.innerHTML=`<div class="row"><h2>${t('saved')}</h2>${langBtn()}</div><div id="list" style="margin-top:14px"></div>`+nav();
  list();
}
function card(f){
  const tn=f.trades?f.trades['name_'+L]:'',on=saved().includes(f.user_id);
  return `<div class="fc">${avatar(f,58)}
  <div><b>${esc(f.display_name)}</b> <span class="tag">${icon(f.trade_id)} ${esc(tn)}</span><br><small>📍 ${esc(f.area||'-')}<br>★ ${f.rating_avg} · ${f.jobs_done} ${t('jn')}</small><br><span class="ok">✔ ${t('vf')}</span></div>
  <button class="hrt" onclick="toggleSave('${f.user_id}')">${on?'❤️':'🤍'}</button>
  <div class="acts"><button class="ghost" onclick="detail('${f.user_id}')">${t('prof')}</button><button class="pri" onclick="contact('${f.user_id}')">${t('contact')}</button></div></div>`;
}
function list(){
  const q=S.q.toLowerCase(),sv=saved(),isS=S.tab==='saved';
  const r=S.f.filter(f=>(isS?sv.includes(f.user_id):(!S.cat||f.trade_id===S.cat))&&(!q||(f.display_name||'').toLowerCase().includes(q)||(f.area||'').toLowerCase().includes(q)));
  $('list').innerHTML=r.length?r.map(card).join(''):`<p class="mute">${t('none')}</p>`;
}
function detail(id){
  const f=S.f.find(x=>x.user_id===id);if(!f)return;
  document.body.insertAdjacentHTML('beforeend',`<div class="ov" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="top"><div style="display:flex;justify-content:center">${avatar(f,112)}</div>
  <h2 style="margin-top:12px">${esc(f.display_name)}</h2><p style="margin:6px 0"><span class="tag">${icon(f.trade_id)} ${esc(f.trades?f.trades['name_'+L]:'')}</span></p><small>📍 ${esc(f.area||'-')}</small></div>
  <div class="stats"><div>★ ${f.rating_avg}<small>${t('rate')}</small></div><div>${f.jobs_done}<small>${t('jn')}</small></div><div>✔<small>${t('vf')}</small></div></div>
  <div style="text-align:left"><b>${t('about')}</b><p class="mute">${esc(f.bio||'-')}</p></div>
  <button class="pri wide" onclick="this.closest('.ov').remove();contact('${f.user_id}')">${t('contact')}</button>
  <button class="ghost wide" onclick="toggleSave('${f.user_id}');this.textContent=saved().includes('${f.user_id}')?'❤️ ${t('saved')}':'🤍 ${t('saved')}'">${saved().includes(f.user_id)?'❤️':'🤍'} ${t('saved')}</button>
  <button class="ghost wide" onclick="this.closest('.ov').remove()">${t('close')}</button></div></div>`);
}
async function contact(id){
  const {error}=await sb.from('jobs').insert({customer_id:me.id,fundi_id:id});
  if(error)return msg(error.message);
  go('jobs');
}
async function viewJobs(){
  const {data,error}=await sb.from('jobs').select('*,fundi:profiles!jobs_fundi_id_fkey(full_name,phone),customer:profiles!jobs_customer_id_fkey(full_name,phone)').order('created_at',{ascending:false});
  if(error)return msg(error.message);
  const f=me.role==='fundi';
  app.innerHTML=`<div class="row"><h2>${t('jobs')}</h2>${langBtn()}</div>`+
  (f&&fp&&!fp.verified?`<div class="box">${t('wait')}</div>`:'')+
  `<div style="margin-top:14px">`+(data.length?data.map(j=>{
    const o=f?j.customer:j.fundi,p=num(o&&o.phone);
    let a=p?`<a class="btn" href="tel:+${p}">📞 ${t('call')}</a><a class="btn" href="https://wa.me/${p}">💬 ${t('wa')}</a>`:'';
    if(f&&j.status==='contacted')a+=`<button class="pri wide" onclick="setJob(${j.id},{status:'in_progress'})">${t('acc')}</button>`;
    if(f&&j.status==='in_progress')a+=`<input id="p${j.id}" type="number" placeholder="${t('price')}"><button class="pri wide" onclick="finish(${j.id})">${t('done')}</button>`;
    if(!f&&j.status==='awaiting_confirm')a+=`<p><b>KES ${j.final_price}</b></p><button class="pri wide" onclick="confirmJob(${j.id},${j.final_price})">${t('conf')}</button>`;
    return `<div class="jc"><div class="row" style="justify-content:flex-start;align-items:flex-start">${avatar({full_name:o&&o.full_name},48)}<div><b>${esc(o&&o.full_name)}</b> <small>#${j.id}</small><br><span class="st s-${j.status}">${t('st')[j.status]}</span>${j.commission?` <small>${t('comm')} KES ${j.commission}</small>`:''}</div></div>${a}</div>`;
  }).join(''):`<p class="mute">${t('none')}</p>`)+`</div>`+nav();
}
async function setJob(id,patch){
  const {error}=await sb.from('jobs').update(patch).eq('id',id);
  if(error)return msg(error.message);
  viewJobs();
}
function finish(id){const v=+$('p'+id).value;if(v)setJob(id,{status:'awaiting_confirm',final_price:v})}
function confirmJob(id,price){setJob(id,{status:'completed',commission:Math.round(price*0.08)})}
function viewMe(){
  const f=me.role==='fundi';
  app.innerHTML=`<div class="row"><h2>${t('me')}</h2>${langBtn()}</div>
  <div class="box" style="text-align:center"><div style="display:flex;justify-content:center">${avatar(f&&fp?{display_name:fp.display_name,trade_id:fp.trade_id}:{full_name:me.full_name},90)}</div>
  <h3 style="justify-content:center">${esc(me.full_name)}</h3><p class="mute">${f?t('fundi'):t('cust')} · ${esc(me.phone||'')}</p>
  ${f&&fp?`<p>${t('avail')}: <b>${fp.available?t('on'):t('off')}</b></p><button class="ghost wide" onclick="toggleAv()">${t('avail')}</button>`:''}
  <button class="pri wide" onclick="sb.auth.signOut().then(()=>{S.tab='home';S.welcome=false;boot()})">${t('out')}</button></div>`+nav();
}
async function toggleAv(){
  const {error}=await sb.from('fundi_profiles').update({available:!fp.available}).eq('user_id',me.id);
  if(error)return msg(error.message);
  fp.available=!fp.available;viewMe();
}
boot();
</script></body></html>
